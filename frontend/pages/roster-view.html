<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="theme-color" content="#1e40af">
  <title>Weekly Roster | ElisCaretex</title>
  <link rel="stylesheet" href="../assets/css/roster-view.css">
  <link rel="stylesheet" href="../assets/css/enterprise-ui.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../assets/js/config.js" defer></script>
  <script src="../assets/js/supabase-client.js" defer></script>
  <script src="../assets/js/roster-view.js" defer></script>
</head>
<body>
  <header class="rv-header morning" id="rvHeader">
    <img class="rv-logo" src="../assets/img/elis-logo.svg" alt="Elis">
    <h1>Weekly Roster</h1>
    <p class="rv-week-label" id="rvWeekLabel">Loading…</p>
    <p class="rv-pub-info" id="rvPubInfo"></p>
    <div class="rv-shift-tabs" id="rvShiftTabs" aria-label="Choose shift">
      <button class="rv-shift-tab active" type="button" data-rv-shift="MORNING">☀ Morning</button>
      <button class="rv-shift-tab" type="button" data-rv-shift="EVENING">☾ Evening</button>
    </div>
    <button class="rv-leave-btn" id="rvLeaveButton" type="button">▣ Request holiday / day off</button>
  </header>

  <div id="rvToast" class="rv-toast" role="status" aria-live="polite" aria-atomic="true"></div>

  <div class="rv-search-wrap">
    <label class="sr-only" for="rvSearch">Search by name</label>
    <input id="rvSearch" class="rv-search" type="search" placeholder="Search by name…" autocomplete="off">
  </div>

  <section class="rv-sched-box" id="rvSchedule" hidden>
    <button class="rv-sched-head" id="rvScheduleToggle" type="button" aria-expanded="false">
      <span class="rv-sched-title"><span class="rv-sched-dot" id="rvScheduleDot"></span>Working Hours</span>
      <span class="rv-sched-chevron" aria-hidden="true">▼</span>
    </button>
    <div class="rv-sched-body" id="rvScheduleBody"></div>
  </section>

  <div class="rv-today-banner hidden" id="rvTodayBanner">
    <span class="rv-today-icon" aria-hidden="true">▣</span>
    <span id="rvTodayText"></span>
  </div>

  <div class="rv-next-bar" id="rvNextBar">
    <div class="rv-next-info">
      <span class="rv-next-label">Next week roster available</span>
      <strong id="rvNextWeekLabel"></strong>
    </div>
    <button class="rv-next-button" id="rvNextButton" type="button">Preview</button>
  </div>

  <main id="rvMain">
    <div class="rv-loading">
      <div class="rv-spinner" aria-hidden="true"></div>
      <strong>Loading roster…</strong>
      <span>Checking the latest published version</span>
    </div>
  </main>

  <div class="rv-modal-overlay" id="rvLeaveOverlay" aria-hidden="true">
    <section class="rv-modal" role="dialog" aria-modal="true" aria-labelledby="rvLeaveTitle">
      <header class="rv-modal-head">
        <h2 id="rvLeaveTitle">▣ Request holiday / day off</h2>
        <button id="rvLeaveClose" class="rv-modal-x" type="button" aria-label="Close">×</button>
      </header>
      <div class="rv-modal-body">
        <p id="rvLeaveRule" class="rv-leave-rule">Requests can be submitted for next week or later. Requests for next week close after Thursday.</p>
        <label class="rv-fld"><span>Your name</span><select id="rvLeaveStaff"></select></label>
        <div class="rv-fld-row">
          <label class="rv-fld"><span>Type</span><select id="rvLeaveType"><option value="DAY_OFF">Day Off (single day)</option><option value="HOLIDAY">Holiday (period)</option></select></label>
          <label class="rv-fld"><span id="rvLeaveStartLabel">Date</span><input id="rvLeaveStart" type="date"></label>
          <label class="rv-fld" id="rvLeaveEndField" hidden><span>End date</span><input id="rvLeaveEnd" type="date"></label>
        </div>
        <label class="rv-fld"><span>Reason (optional)</span><input id="rvLeaveReason" type="text" maxlength="280" placeholder="e.g. family appointment"></label>
        <p id="rvLeaveMessage" class="rv-leave-msg" aria-live="polite"></p>
        <div id="rvMyLeaveRequests" class="rv-modal-mine"></div>
      </div>
      <footer class="rv-modal-foot">
        <button id="rvLeaveCancel" class="rv-btn-ghost" type="button">Cancel</button>
        <button id="rvLeaveSubmit" class="rv-btn-primary" type="button">Submit request</button>
      </footer>
    </section>
  </div>
</body>
</html>
