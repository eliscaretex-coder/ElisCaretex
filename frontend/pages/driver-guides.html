<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Driver Self-service</title>
<link rel="stylesheet" href="../assets/css/driver-roster.css?v=20261017-1"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.118.0"></script><script src="../assets/js/config.js" defer></script><script src="../assets/js/supabase-client.js" defer></script><script src="../assets/js/driver-guides.js?v=20261017-2" defer></script></head>
<body><header><a href="./distribution.html#routes">Back to Distribution</a><div><small>DISTRIBUTION SUPERVISOR</small><h1>Driver Self-service</h1></div></header><main><p id="message" aria-live="polite"></p>
<section class="leave"><h2>Pending Holiday / Day off requests</h2><div id="leaveRequests"></div></section>
<section class="leave"><h2>Add customer photo or PDF</h2><form id="guideForm"><label class="wide">Customer<select id="customer" required></select></label><label class="wide">Title<input id="title" required maxlength="160" placeholder="e.g. Loading bay entrance"></label><label class="wide">Instructions<textarea id="description" maxlength="1000"></textarea></label><label class="wide">Photo or PDF<input id="file" type="file" accept="image/jpeg,image/png,image/webp,application/pdf" required></label><button type="submit">Upload guide</button></form></section>
<section class="leave"><h2>Registered customer guides</h2><label>Filter by customer<select id="filter"></select></label><div id="guides"></div></section></main></body></html>
