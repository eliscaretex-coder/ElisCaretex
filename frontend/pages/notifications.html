<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Notifications | ElisCaretex</title><link rel="stylesheet" href="../assets/css/enterprise-ui.css"><link rel="stylesheet" href="../assets/css/notifications.css?v=20260925-4"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="../assets/js/config.js" defer></script><script src="../assets/js/supabase-client.js" defer></script><script src="../assets/js/notifications.js?v=20260925-4" defer></script></head><body>
<main class="notify-shell"><header class="notify-head"><div><span>STAFF COMMUNICATION</span><h1>Notifications</h1><p>Requests, decisions and staff updates.</p></div><a href="../index.html">&#8592; Back</a></header>
<section class="notify-panel"><div class="notify-panel-head"><div><h2>Communication centre</h2><small id="notifySummary"></small></div><div class="notify-actions"><button id="notifyCompose" class="hidden" type="button">+ New notice</button><button id="notifyReload" type="button">Reload</button></div></div>
<nav id="notifyTabs" class="notify-tabs hidden"><button class="active" data-tab="inbox" type="button">My inbox</button><button data-tab="sent" type="button">Sent notices</button></nav>
<div id="notifyInbox"><div id="notifyList" class="notify-list"><p class="notify-empty">Loading notifications…</p></div></div>
<div id="notifySent" class="hidden"><p id="notifySentStatus" class="notify-sent-status hidden"></p><div id="notifySentList" class="notify-list"><p class="notify-empty">Open this tab to view sent notices.</p></div></div></section></main>
<dialog id="notifyDialog" class="notify-dialog"><form id="notifyForm" class="notify-form"><div class="notify-form-head"><div><small>STAFF COMMUNICATION</small><strong>New notice</strong></div><button id="notifyCancel" type="button" aria-label="Close">×</button></div><label>Title<input id="notifyTitle" maxlength="120" required></label><label>Message<textarea id="notifyMessage" maxlength="2000" rows="4" required></textarea></label><div class="notify-form-grid"><label>Type<select id="notifyType"><option value="INFORMATION">Information</option><option value="ACTION_REQUIRED">Action required</option><option value="TRAINING">Training</option></select></label><label>Recipients<select id="notifyRecipients"><option value="ALL">All eligible active staff</option></select></label><label>Visible in staff inbox<select id="notifyVisibleDays"><option value="7">7 days</option><option value="14">14 days</option><option value="30" selected>30 days</option><option value="60">60 days</option></select></label></div><label class="notify-check"><input id="notifyAck" type="checkbox"> Require acknowledgement</label><div class="notify-form-foot"><span id="notifyFormStatus"></span><button id="notifySend" class="primary" type="submit">Send notice</button></div></form></dialog>
</body></html>
