<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Notifications | ElisCaretex</title><link rel="stylesheet" href="../assets/css/enterprise-ui.css"><link rel="stylesheet" href="../assets/css/notifications.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="../assets/js/config.js" defer></script><script src="../assets/js/supabase-client.js" defer></script><script src="../assets/js/notifications.js?v=20260925-1" defer></script></head>
<body><main class="notify-shell"><header class="notify-head"><div><span>SELF SERVICE</span><h1>Notifications</h1><p>Requests, decisions and staff updates.</p></div><a href="../index.html">&#8592; Back</a></header><section class="notify-panel"><div class="notify-panel-head"><div><h2>Inbox</h2><small id="notifySummary"></small></div><div class="notify-actions"><button id="notifyCompose" class="hidden" type="button">New notice</button><button id="notifyReload" type="button">Reload</button></div></div><form id="notifyForm" class="notify-form hidden"><div class="notify-form-head"><strong>New staff notice</strong><button id="notifyCancel" type="button">Cancel</button></div><label>Title<input id="notifyTitle" maxlength="120" required></label><label>Message<textarea id="notifyMessage" maxlength="2000" rows="4" required></textarea></label><div class="notify-form-grid"><label>Type<select id="notifyType"><option value="INFORMATION">Information</option><option value="ACTION_REQUIRED">Action required</option><option value="TRAINING">Training</option></select></label><label>Recipients<select id="notifyRecipients"><option value="ALL">All active staff with access</option></select></label></div><label class="notify-check"><input id="notifyAck" type="checkbox"> Require acknowledgement</label><div class="notify-form-foot"><span id="notifyFormStatus"></span><button type="submit">Send notice</button></div></form><div id="notifyList" class="notify-list"><p class="notify-empty">Loading notifications…</p></div></section></main></body></html>
