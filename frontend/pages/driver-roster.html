<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>My Driver Roster</title>
<link rel="stylesheet" href="../assets/css/driver-roster.css?v=20261017-1"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.118.0"></script><script src="../assets/js/config.js" defer></script><script src="../assets/js/supabase-client.js" defer></script><script src="../assets/js/driver-roster.js?v=20261017-1" defer></script></head>
<body><header><a href="../index.html" aria-label="Home">← Home</a><div><small>DISTRIBUTION</small><h1>My Driver Roster</h1></div><button id="refresh" type="button">Refresh</button></header>
<main><p id="message" aria-live="polite"></p><section class="weekbar"><button data-shift="-1">‹</button><strong id="weekLabel">This week</strong><button data-shift="1">›</button></section><section id="identity" class="identity"></section><section id="days" class="days"></section>
<section class="leave"><h2>Holiday / Day off</h2><form id="leaveForm"><label>Type<select id="leaveType"><option value="HOLIDAY">Holiday</option><option value="DAY_OFF">Day off</option></select></label><label>From<input id="leaveStart" type="date" required></label><label>To<input id="leaveEnd" type="date" required></label><label class="wide">Reason (optional)<textarea id="leaveReason" maxlength="500"></textarea></label><button type="submit">Send request</button></form><div id="requests"></div></section></main>
<dialog id="routeDialog"><header><h2 id="routeTitle">Route</h2><button data-close>×</button></header><div id="stops"></div></dialog>
<dialog id="guideDialog"><header><h2 id="guideTitle">Customer guide</h2><button data-close>×</button></header><div id="guideBody"></div></dialog></body></html>
