<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"><meta name="theme-color" content="#123b65"><title>My Driver Roster</title>
<link rel="stylesheet" href="../assets/css/enterprise-ui.css"><link rel="stylesheet" href="../assets/css/roster-view.css?v=20260925-1"><link rel="stylesheet" href="../assets/css/driver-roster.css?v=20261017-3"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.118.0"></script><script src="../assets/js/config.js" defer></script><script src="../assets/js/supabase-client.js" defer></script><script src="../assets/js/app-shell-policy.js?v=20261021-1" defer></script><script src="../assets/js/operational-page-nav.js?v=20261021-1" defer></script><script src="../assets/js/driver-roster.js?v=20261017-3" defer></script><link rel="stylesheet" href="../assets/css/navigation.css?v=20261021-1"></head>
<body><div class="shell-page-root" data-operational-shell-root><div class="shell-page"><header class="rv-header driver-header"><a class="rv-back" href="../index.html">Back</a><h1 id="pageTitle">My Driver Roster</h1><p class="rv-week-label" id="weekLabel">Loading...</p><p class="rv-pub-info" id="pubInfo"></p><div class="driver-week-nav" id="managementWeekNav"><button data-shift="-1">Previous week</button><button id="refresh">Refresh</button><button data-shift="1">Next week</button></div><div class="driver-week-nav" id="driverWeekNav" hidden><button id="driverWeekToggle" type="button">View next week</button></div><button class="rv-leave-btn" id="leaveOpen" type="button">Request holiday / day off</button></header>
<div class="rv-search-wrap" id="searchWrap"><input id="search" class="rv-search" type="search" placeholder="Search driver..."></div><p id="message" class="rv-message hidden" aria-live="polite"></p><main id="driverMain"><div class="rv-loading"><div class="rv-spinner"></div><strong>Loading roster...</strong></div></main>
<dialog id="routeDialog"><header><h2 id="routeTitle">Route</h2><button data-close>×</button></header><div id="stops"></div></dialog><dialog id="guideDialog"><header><h2 id="guideTitle">Customer guide</h2><button data-close>×</button></header><div id="guideBody"></div></dialog>
<dialog id="leaveDialog"><header><h2>Request holiday / day off</h2><button data-close>×</button></header><form id="leaveForm" class="leave-form"><label>Type<select id="leaveType"><option value="HOLIDAY">Holiday</option><option value="DAY_OFF">Day off</option></select></label><label>From<input id="leaveStart" type="date" required></label><label>To<input id="leaveEnd" type="date" required></label><label class="wide">Reason (optional)<textarea id="leaveReason" maxlength="500"></textarea></label><button type="submit">Send request</button></form><div id="requests" class="request-list"></div></dialog></div></div></body></html>
