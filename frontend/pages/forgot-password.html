<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta
    name="description"
    content="Request a secure ElisCaretex password recovery link."
  >

  <title>Reset Password | ElisCaretex</title>

  <link rel="stylesheet" href="../assets/css/global.css">
  <link rel="stylesheet" href="../assets/css/enterprise-ui.css">

  <!-- Official Supabase browser library -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2" defer></script>

  <!-- File order is important -->
  <script src="../assets/js/config.js?v=20260925-1" defer></script>
  <script src="../assets/js/supabase-client.js" defer></script>
  <script src="../assets/js/forgot-password.js?v=20260925-1" defer></script>
</head>

<body>
  <main class="page">
    <section class="card auth-card" aria-labelledby="pageTitle">
      <div class="brand">
        <img
          class="brand-logo"
          src="../assets/img/elis-logo.svg"
          alt="Elis"
        >

        <div>
          <h1 id="pageTitle">Reset your password</h1>
          <p>ElisCaretex</p>
        </div>
      </div>

      <p class="auth-introduction">
        Enter the email address associated with your account. We will send
        you a secure link to create a new password.
      </p>

      <form id="passwordRecoveryForm" novalidate>
        <div class="field">
          <label for="recoveryEmail">Email</label>

          <input
            id="recoveryEmail"
            name="email"
            type="email"
            inputmode="email"
            autocomplete="email"
            maxlength="254"
            required
          >
        </div>

        <button
          id="recoveryButton"
          class="primary-button"
          type="submit"
        >
          Send recovery link
        </button>
      </form>

      <p
        id="recoveryMessage"
        class="message"
        role="status"
        aria-live="polite"
      ></p>

      <div class="auth-footer">
        <a class="auth-link" href="../index.html">
          Back to sign in
        </a>
      </div>
    </section>
  </main>
</body>
</html>
