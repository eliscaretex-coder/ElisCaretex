<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>Trolleys | ElisCaretex</title>

  <link rel="stylesheet" href="../assets/css/global.css">
  <link rel="stylesheet" href="../assets/css/app-shell.css">
  <link rel="stylesheet" href="../assets/css/trolleys.css">
  <link rel="stylesheet" href="../assets/css/enterprise-ui.css">

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../assets/js/config.js" defer></script>
  <script src="../assets/js/supabase-client.js" defer></script>
  <script src="../assets/js/app-shell-policy.js" defer></script>
  <script src="../assets/js/operational-page-nav.js" defer></script>
  <script src="../assets/js/trolleys.js" defer></script>
</head>

<body class="trolleys-page">
  <div class="operational-tool-page-shell" data-operational-shell-root>
    <div class="trolleys-shell">
    <header class="trolleys-header">
      <div class="trolleys-brand">
        <a href="../index.html" class="trolleys-logo-link" aria-label="Return to Home">
          <img src="../assets/img/elis-logo.svg" alt="Elis" class="trolleys-logo">
        </a>
        <div>
          <p class="trolleys-environment">ElisCaretex-dev</p>
          <h1>Physical Trolleys</h1>
          <p>Current location, customer days, Trolley Master, Trolley Types and traceable history</p>
        </div>
      </div>

      <div class="trolleys-header-actions">
        <div class="trolleys-as-of">
          <span>Current overview</span>
          <strong id="trolleyAsOfDate">—</strong>
        </div>
        <a href="../index.html" class="trolleys-header-button">Home</a>
        <button id="trolleySignOutButton" class="trolleys-header-button" type="button">Sign out</button>
      </div>
    </header>

    <p id="trolleyPageMessage" class="trolleys-page-message" aria-live="polite"></p>

    <nav id="trolleyTabs" class="trolleys-tabs" aria-label="Trolley module"></nav>

    <main id="trolleyMainPanel" class="trolleys-main-panel">
      <div class="trolleys-loading">
        <span class="trolleys-spinner" aria-hidden="true"></span>
        <p>Loading trolley consultation...</p>
      </div>
    </main>
    </div>
  </div>

  <div id="trolleyRecordModal" class="trolleys-modal hidden" role="dialog" aria-modal="true">
    <button id="trolleyRecordBackdrop" class="trolleys-modal-backdrop" type="button" aria-label="Close trolley record"></button>
    <section class="trolleys-modal-card trolleys-record-modal">
      <header class="trolleys-modal-header">
        <div>
          <p class="trolleys-modal-code">Physical Trolley</p>
          <h2 id="trolleyRecordTitle">Trolley</h2>
          <p id="trolleyRecordSubtitle"></p>
        </div>
        <button id="trolleyRecordClose" class="trolleys-icon-button" type="button" aria-label="Close trolley record">×</button>
      </header>
      <div id="trolleyRecordBody" class="trolleys-modal-body"></div>
      <footer class="trolleys-modal-footer">
        <button id="trolleyRecordCloseSecondary" class="trolleys-secondary-button" type="button">Close</button>
      </footer>
    </section>
  </div>

  <div id="trolleyReviewModal" class="trolleys-modal hidden" role="dialog" aria-modal="true">
    <button id="trolleyReviewBackdrop" class="trolleys-modal-backdrop" type="button" aria-label="Close review"></button>
    <section class="trolleys-modal-card">
      <header class="trolleys-modal-header">
        <div>
          <p class="trolleys-modal-code">Trolley data review</p>
          <h2 id="trolleyReviewTitle">Review trolley data</h2>
          <p id="trolleyReviewSubtitle"></p>
        </div>
        <button id="trolleyReviewClose" class="trolleys-icon-button" type="button" aria-label="Close review">×</button>
      </header>
      <form id="trolleyReviewForm" class="trolleys-form">
        <input id="trolleyReviewStayId" type="hidden">
        <input id="trolleyReviewAction" type="hidden">
        <div id="trolleyReviewSummary" class="trolleys-review-summary"></div>
        <label class="trolleys-field">
          <span>Review notes <strong id="trolleyReviewRequiredMarker">*</strong></span>
          <textarea id="trolleyReviewNotes" rows="5" maxlength="1500"></textarea>
        </label>
        <p id="trolleyReviewMessage" class="trolleys-inline-message" aria-live="polite"></p>
      </form>
      <footer class="trolleys-modal-footer">
        <button id="trolleyReviewCancel" class="trolleys-secondary-button" type="button">Cancel</button>
        <button id="trolleyReviewConfirm" class="trolleys-primary-button" type="submit" form="trolleyReviewForm">Confirm</button>
      </footer>
    </section>
  </div>
</body>
</html>
